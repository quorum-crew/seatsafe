name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Run gofmt on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate Go code from protos
        run: ./scripts/proto.sh
      - name: Check generated code is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- gen)" ]; then
            git status --short -- gen
            echo "gen/ is out of date: run ./scripts/proto.sh and commit the result."
            exit 1
          fi

  cluster-smoke:
    needs: [test, proto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start cluster and wait for healthchecks
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check router
        run: curl -fsS http://localhost:8080/healthz
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
