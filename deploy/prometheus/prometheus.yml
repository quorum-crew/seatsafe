global:
  scrape_interval: 5s

scrape_configs:
  - job_name: router
    static_configs:
      - targets: ["router:8080"]
  - job_name: storage
    static_configs:
      - targets:
          - shard1-node1:8080
          - shard1-node2:8080
          - shard1-node3:8080
          - shard2-node1:8080
          - shard2-node2:8080
          - shard2-node3:8080
          - shard3-node1:8080
          - shard3-node2:8080
          - shard3-node3:8080
  - job_name: coordinator
    static_configs:
      - targets: ["coord-1:8080", "coord-2:8080", "coord-3:8080"]
